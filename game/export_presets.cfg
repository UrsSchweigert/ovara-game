; Export presets for Ovara (Android and iOS). The bundle id is com.ovara.game for both platforms.
; Signing is not in this file. See docs/build/README.md.
; Orientation (window/handheld/orientation=4) and the Compatibility renderer
; (renderer/rendering_method="gl_compatibility") come from game/project.godot.
; These presets do not override either.
; Every signing field is empty on purpose. Signing is entered on your machine only.
; Do not put keystore paths, passwords, team IDs or profile UUIDs in this file.

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/ovara.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

gradle_build/use_gradle_build=false
package/unique_name="com.ovara.game"
package/name="Ovara"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
version/code=1
version/name="0.1.0"
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""

[preset.1]

name="iOS"
platform="iOS"
runnable=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/ios/Ovara"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

application/title="Ovara"
application/version="0.1.0"
application/short_version="0.1.0"
application/export_project_only=false
application/bundle_identifier="com.ovara.game"
application/signature=""
application/app_store_team_id=""
application/code_sign_identity_debug=""
application/code_sign_identity_release=""
application/export_method_debug=1
application/export_method_release=2
application/provisioning_profile_uuid_debug=""
application/provisioning_profile_uuid_release=""
application/targeted_device_family=2
application/min_ios_version="14.0"
