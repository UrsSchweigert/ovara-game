name: check

# The required status check for the base branch and for harness run branches. The harness refuses to merge
# without at least one required check; make "check" required in the branch protection settings.
on:
  pull_request:
  push:
    branches: [main, "harness/run/**"]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tools/requirements.txt
      - name: Godot (headless)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1 unzip
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --headless --version
      - name: Project check
        run: ./ov check
      - name: Harness tests
        run: |
          .venv/bin/pip install pytest
          PYTHONPATH=tools .venv/bin/python -m pytest tools/harness/tests -q -p no:cacheprovider
