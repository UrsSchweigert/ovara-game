id: machine.lamp
name: Maker lamp
type: machine
kind: building-part
summary: >
  The Makers' light, one of three things (with air-hearts and warm-stones) that keep every hold alive.
facts:
  - Gives the light of every hold.
  - When a lamp fails it is silted up, seated wrong or worn through; mending is clearing, seating or replacing.
  - Lampweed is hung where lamps have failed.
links:
  machines: [machine.air-heart, machine.warm-stone]
  flora: [flora.lampweed]
sources:
