id: person.ilan-voss
name: Ilan Voss
type: person
kind: hero
region: place.saltgate
summary: >
  Shallowborn Chief Surveyor of Halcyon Dredge & Mineral, thrown overboard by Rook's order and washed up at Low Anthem as the memoryless Wrack.
facts:
  - Called Wrack until chapter 7; the name was given by Sefa and means what the tide brings in.
  - Shallowborn: his father was an agravar dock engineer in Saltgate, his mother a mariner who hid ashore.
  - At sixteen, a week after his father's funeral, he won the Meridian Scholarship when a grey rod of Maker work flickered in his hands.
  - Anselm Rook paid for him, placed him at Keelhaven then Halcyon, and dined with him once a year for twenty-two years.
  - Planned Halcyon's dumping routes, including the one over Low Anthem, and led the dig at Site Nine at Rook's quiet request.
  - Thrown overboard by Adler Crane with his wrists tied; the undertow took his memory and the rays keep it.
  - The first person to hold both the craft and the gift; reach 5.
