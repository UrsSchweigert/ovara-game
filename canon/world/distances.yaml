id: world.distances
name: Distances and travel times
type: world
summary: >
  The fixed distances and travel times of Ovara: positions north to south
  and along the Girdle, how fast travellers go in a day, and some journeys.
facts:
  - These figures are fixed; anything set in Ovara should agree with them.
  - A day is the 18-hour day.
  - About 12,000 km from Tip to Tip along the Dragon's line.
  - About 24,000 km round the Girdle; the islands lie along some 3,500 km of it.
  - North-south positions are kilometres from the north Tip.
  - Along-Girdle positions are kilometres east of Concord.
  - Lashing has no place along the Girdle - it moves with its Eye.
# Tables copied from world-bible.md#2 "Distances and travel times".
