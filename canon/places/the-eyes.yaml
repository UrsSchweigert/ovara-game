summary: >
  Calm windows that drift through the Belt Storms on a known pattern.
facts:
  - Calm windows that drift through the Belt Storms on a known pattern.
  - Surface ships cross the Girdle by hopping from Eye to Eye.
  - Missing one can cost a week or the ship.
  - Lashing lives in an Eye and moves with it.
