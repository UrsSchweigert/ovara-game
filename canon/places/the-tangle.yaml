id: place.the-tangle
name: The Tangle
type: place
kind: wild-kelp
region: place.anthem-waters
summary: >
  Wild, unfarmed kelp east of the holds, littered with agravar wrecks from
  the Charter Wars; Breakers hide here.
facts:
  - Wild, unfarmed kelp, dark and thick.
  - Littered with agravar wrecks from the Charter Wars.
  - Breakers hide here.
  - So do things that should not be this far north.
  - East of the holds.
  - Sounding lies in it.
position:
