id: place.port-halcyon
name: Port Halcyon
type: place
kind: city
region: place.the-girdle
summary: >
  City of two million stacked up the inside of a flooded caldera on the Crown, in three bands.
facts:
  - A city of two million.
  - Built up the inside of a flooded caldera in three bands: the Waterline, the Stacks and the Rim.
  - Ash falls most days; on the Rim, men are paid to sweep it.
  - The harbour is deaf water.
  - Behind the sea-wall on the refinery quay stand two hundred Meridian tank-sheds with tin roofs.
position:
  km_east_of_concord: "3,000"
  km_from_north_tip: "not given"
sources:
  - world-bible.md#2
  - world-bible.md#11
