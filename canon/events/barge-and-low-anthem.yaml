summary: Wrack's anger lifts a waste barge clear; Halcyon gunboats answer by dropping charges on Low Anthem.
facts:
  - A Raise far beyond any Mighty, in fouled water, that he cannot control.
  - Part of the dome floods and twenty-one people die, Elder Oro and Davin among them.
  - Hesper leaves for the Breakers; Okonta arrives to take him to Jef.
