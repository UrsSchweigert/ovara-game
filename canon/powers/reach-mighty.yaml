id: power.reach-mighty
name: The Mighty
type: power
kind: reach
summary: >
  Reach 3: a ship's worth of water. About one per hold.
facts:
  - Reach 3 of 5.
  - About one Mighty per hold.
  - Can work a ship's worth of water, such as stopping a vessel, raising a wave over a deck or saving the dying.
  - Most callers never reach Raise.
  - Hesper is the Mighty of Low Anthem, reach 3 in calling.
