# Canon terms. `term` is the only accepted form in content and in-game text.
# `banned` words fail `./ov check` when found in game/content/ or in player-facing text under game/.
# The canon keeper extends this during ingestion (task M0-01).

- term: agravar
  meaning: A land-dweller of Ovara.
  banned: [lander, landwalker, surface-dweller, drylander]

- term: mariner
  meaning: A water-breathing person of the undersea holds.
  banned: [merfolk, merman, mermaid, sea-person, atlantean]

- term: hold
  meaning: A mariner settlement in a Maker structure.
  banned: [dome-city, undersea city, colony]

- term: Maker
  meaning: The lost civilisation that built the holds, the Dragon and the Wells' buildings.
  banned: [Ancient, Precursor, Old One, Builder]

- term: the gift
  meaning: The magic by which the sea answers a mariner.
  banned: [mana, sorcery, spell, spellcasting, water magic]

- term: tidecalling
  meaning: Using the gift to move water. A person who does is a Tidecaller.
  banned: [water-bending, waterbending, hydromancy, hydrokinesis]

- term: intending
  meaning: Using the gift to heal. The result is intended water.
  banned: [healing magic, holy water, healing potion]

- term: reach
  meaning: The scale of the gift a person can use safely, 1 to 5.
  banned: [level, power level, tier, rank]

- term: Touched
  meaning: Reach 1, a room's worth of water; about one mariner in ten.
  banned: [novice caller, hedge caller]

- term: the Mighty
  meaning: Reach 3, a ship's worth of water; about one per hold.
  banned: [archmage, high caller, master caller]

- term: the ebb
  meaning: Being cold, shaking, parched and unable to call after real effort with the gift. A caller in it is ebbed.
  banned: [mana burn, cooldown]

- term: ebbed
  meaning: Exhausted by using the gift and unable to call.
  banned: [out of mana, drained, depleted]

- term: the undertow
  meaning: What takes something permanently from a caller who overreaches.
  banned: [backlash, burnout, corruption]

- term: fouled water
  meaning: Polluted water in which the gift is one reach weaker.
  banned: [tainted water, corrupted water, toxic water]

- term: deaf water
  meaning: Dead water in which the gift does not answer at all.
  banned: [dead zone water, null water, anti-magic]

- term: orphan water
  meaning: Water cut off from the sea.
  banned: [stagnant water, tank water]

- term: chorus
  meaning: Several callers each holding one part of a shared work; fails if one drops.
  banned: [ritual, circle, combo]

- term: shared calling
  meaning: Many callers' strength passing through one will. First achieved in chapter 12.
  banned: [link, merge, fusion, unison]

- term: ordering
  meaning: Commanding the sea instead of asking it. It obeys at once and the water goes deaf. Callers have no name for it; this is the game's term.
  banned: [compel, dominate, dark calling, blood magic]

- term: restore
  meaning: The fourth form of intending. Regrows what is lost; done by many healers together, it can bring ordered water back to hearing.
  banned: [resurrect, revive, cleanse]

- term: the craft
  meaning: Maker technology and the skill of tending, mending and making it.
  banned: [artifice, techno-magic, ancient tech]

- term: the Thread
  meaning: Jef's implant for steering Maker vehicles. Those who carry it are the Threaded.
  banned: [neural link, cyberware, augment]

- term: the Dragon
  meaning: The Maker transit machine circling Ovara from Tip to Tip.
  banned: [sea serpent, water dragon train, leviathan]

- term: Wellwalker
  meaning: A travelling healer from one of the two great hospitals.
  banned: [cleric, medic, wandering doctor]

- term: Tender
  meaning: A mariner who cleans up and endures.
  banned: [pacifist, loyalist]

- term: Breaker
  meaning: A mariner who wants to strike back at the agravars.
  banned: [rebel, terrorist, extremist]

- term: the fouled
  meaning: Creatures warped by dumping.
  banned: [mutants, monsters, corrupted]

- term: scrip
  meaning: Corporate currency of the islands.
  banned: [credits, gold, dollars, coins]

- term: Shallowborn
  meaning: A child of a mariner and an agravar. Some breathe water, some cannot, some only for a while.
  banned: [half-breed, halfbreed, hybrid, half-blood, mixed-blood]

- term: Driftfolk
  meaning: Agravars with no corporation, who live on raft-towns that follow the Eyes through the Belt Storms.
  banned: [nomads, sea gypsies, pirates, rafters]

- term: Wrecker
  meaning: A salvager who dives on drowned Maker ruins for technology to sell to Kessler-Vane.
  banned: [looter, tomb raider, treasure hunter]

- term: the Clean Hands
  meaning: The agravar underground that sabotages dumping and smuggles information to the holds. It has no leader.
  banned: [hacktivists, saboteurs]

- term: the great rays
  meaning: A third people of the deep, older than the Makers. Their gift is memory; they keep what the undertow takes.
  banned: [sea angels, ray-gods]

- term: the Moot
  meaning: A gathering of the speakers of the holds in the same waters. It does not vote; it talks until nobody is left who will not go along.
  banned: [senate, congress, summit]

- term: the long-call
  meaning: News sung from hold to hold, a few short phrases that carry a fact and nothing else.
  banned: [sea telegraph, song-mail]

- term: the Tips
  meaning: The two ends of the world, north and south, each with a Well.
  banned: [north pole, south pole]

- term: the Wells
  meaning: The two vast trenches, one at each Tip, with a great hospital at the bottom of each. The gift is one reach stronger there.
  banned: [abyss, the deeps]

- term: the Eyes
  meaning: Calm windows that drift through the Belt Storms on a known pattern.
  banned: [storm windows, calm zones]

- term: Lockkeeper
  meaning: One of the keepers of the great iron lock-gates of Saltgate, who take the same toll from everyone and a side for no one.
  banned: [gatekeeper, toll-keeper, harbour guard]

- term: sea-door
  meaning: The round pool in a hold's floor with sea on one side of its surface and air on the other.
  banned: [airlock, moon pool, water-lock]

- term: calling stone
  meaning: A six-sided Maker pillar on the seabed that sings one low note when the Dragon is within a day.
  banned: [waystone, obelisk, monolith]

- term: air-heart
  meaning: A Maker shell that draws the foulness out of seawater and breathes clean air into a hold's dry halls.
  banned: [oxygen generator, life support, air plant]

- term: needle
  meaning: A Maker vehicle, a sliver of pale metal ridden lying along it, with room for one passenger.
  banned: [jet-ski, hoverbike, speeder]
